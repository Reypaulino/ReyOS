# ReyOS WSL — /etc/wsl.conf
# Only settings that deviate from WSL's own defaults are listed. See
# docs/wsl.md "WSL configuration" for the reasoning behind each one.

[boot]
# Modern WSL2 supports systemd inside the guest; several reyos-* packages
# and normal package-building workflows (makepkg's fakeroot, sshd for
# testing, etc.) assume a working systemd instance. Left on — flip to
# false only if a specific WSL/Windows build can't support it (see
# docs/wsl.md's systemd verification steps).
systemd=true

[user]
# Set by first-run/reyos-wsl-init.sh once a real user exists — starts
# unset (root) so first boot can run the setup wizard. Do not hardcode
# a username here in the build; the script rewrites this line in place.
default=root

[interop]
# Keep Windows interop on: it's what lets `explorer.exe`, clipboard tools,
# and Windows-side git credential helpers work from inside ReyOS WSL.
# Left at WSL's default (true) — no override needed, listed here only so
# the decision is documented rather than silently assumed.
enabled=true
appendWindowsPath=true

[automount]
# Default (true) — Windows drives stay mounted under /mnt/c etc. ReyOS
# WSL does not disable this: docs/wsl.md tells developers to prefer
# ~/Projects for heavy builds, but blocking /mnt access outright would
# break legitimate cross-filesystem workflows.
enabled=true

[network]
# Default WSL networking (NAT or mirrored, whichever the installed WSL
# version uses) is left alone. See docs/wsl.md "Networking" for what was
# actually verified vs. assumed.
generateHosts=true
generateResolvConf=true
