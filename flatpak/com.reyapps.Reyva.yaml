app-id: com.reyapps.Reyva
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: "6.11"
command: com.reyapps.Reyva

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets

build-options:
  env:
    BASEAPP_DISABLE_NUMPY: "1"

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  # Pure-Python Secret Service client; replaces python-secretstorage, which
  # needs the compiled `cryptography` package.
  - name: python3-jeepney
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-build-isolation jeepney
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b2/a3/e137168c9c44d18eff0376253da9f1e9234d0239e0ee230d2fee6cea8e55/jeepney-0.9.0-py3-none-any.whl
        sha256: 97e5714520c16fc0a45695e5365a2e11b81ea79bba796e26f9f1d178cb182683

  - name: python3-setproctitle
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-build-isolation setproctitle
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/49/b0/6b8a516c5a9e9630bd5293db78314ac012f690305fe93beadea388626efb/setproctitle-1.3.8.tar.gz
        sha256: cafe209d064a6efb88cb45a03e97981ff8832802b2b5d009dde0197a3b7b41c8

  - name: reyva
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/reyos
      - cp -r reyos-packages/reyos-browser/files/usr/share/reyos/browser ${FLATPAK_DEST}/share/reyos/browser
      - rm -rf ${FLATPAK_DEST}/share/reyos/browser/__pycache__ ${FLATPAK_DEST}/share/reyos/browser/assets/reyos-browser.ico
      - install -Dm755 flatpak/reyos-browser-launcher ${FLATPAK_DEST}/bin/com.reyapps.Reyva
      - install -Dm644 flatpak/com.reyapps.Reyva.desktop ${FLATPAK_DEST}/share/applications/com.reyapps.Reyva.desktop
      - install -Dm644 flatpak/com.reyapps.Reyva.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.reyapps.Reyva.metainfo.xml
      - install -Dm644 reyos-packages/reyos-browser/files/usr/share/reyos/browser/assets/reyos-browser-logo.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.reyapps.Reyva.png
    sources:
      - type: git
        url: https://github.com/Reypaulino/ReyOS.git
        commit: c497db866a94725ebbd1dd82d9aa05a063a43543
