<!-- Source for ReyOS's per-Look mouse pointer. Not shipped as-is: build-
     cursors.sh substitutes ACCENT_HEX_PLACEHOLDER with each Look's own
     DecorationFocus hex (same source of truth applyLook() already reads
     for icons/decoration.svg) and compiles the result to a real XCursor
     file with xcursorgen. Off-white fill (#f5efe8, close to every Look's
     own ForegroundNormal) plus a dark contrast rim keeps the pointer
     readable over any wallpaper regardless of accent. The 2px inner rim
     carries the Look's own color and leaves a narrow dark outer keyline for
     contrast; this makes the matching accent clearly visible without turning
     the pointer into a large or heavy cursor. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <path d="M4,3 L4,26.5 L9.2,21.3 L13.4,29.6 L17.3,27.6 L13.1,19.4 L21,19.4 Z"
        fill="#0d0a08" stroke="#0d0a08" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M4,3 L4,26.5 L9.2,21.3 L13.4,29.6 L17.3,27.6 L13.1,19.4 L21,19.4 Z"
        fill="#f5efe8" stroke="ACCENT_HEX_PLACEHOLDER" stroke-width="2" stroke-linejoin="round"/>
</svg>
