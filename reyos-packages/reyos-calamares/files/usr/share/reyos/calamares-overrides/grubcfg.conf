#
# ReyOS override of cachyos-calamares's grubcfg.conf. Fixed GRUB_TOP_LEVEL
# for our plain "linux" kernel (was "/boot/vmlinuz-linux-cachyos"). Dropped
# GRUB_THEME entirely — it pointed at /usr/share/grub/themes/cachyos/, which
# doesn't exist on ReyOS; reyos-grub's own theme exists in the repo but
# isn't wired into packages.x86_64 yet (see docs/whats-next.md), so this
# stays stock-GRUB-visuals until that's done — revisit then rather than
# reference a path that isn't there.
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params:
  - "nowatchdog"
defaults:
    GRUB_TIMEOUT: 5
    GRUB_TOP_LEVEL: "/boot/vmlinuz-linux"
    GRUB_DISABLE_SUBMENU: false
    GRUB_DISABLE_OS_PROBER: false
    GRUB_DISABLE_RECOVERY: true
    GRUB_EARLY_INITRD_LINUX_STOCK: ""
always_use_defaults: true
