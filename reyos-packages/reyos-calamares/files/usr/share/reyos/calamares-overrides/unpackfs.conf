#
# ReyOS override of cachyos-calamares's unpackfs.conf. The stock file points
# at "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs" and
# "vmlinuz-linux-cachyos" — both wrong for us: our profiledef.sh sets
# install_dir="reyos" (not "arch"), so mkarchiso lays the squashfs out at
# reyos/x86_64/airootfs.sfs, and packages.x86_64 ships the plain "linux"
# kernel, not linux-cachyos, so the vmlinuz filename differs too. Confirmed
# against a real build's work/iso/ tree on the ReyOS dev VM (2026-08-09):
# reyos/x86_64/airootfs.sfs and reyos/boot/x86_64/vmlinuz-linux.
unpack:
    -   source: "/run/archiso/bootmnt/reyos/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/archiso/bootmnt/reyos/boot/x86_64/vmlinuz-linux"
        sourcefs: "file"
        destination: "/boot/vmlinuz-linux"
