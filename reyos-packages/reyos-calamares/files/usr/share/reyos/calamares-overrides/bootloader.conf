#
# ReyOS override of cachyos-calamares's bootloader.conf. Real changes:
# efiBootloaderId (was "cachyos"), limineSplashLogo (was CachyOS's own
# wallpaper package, not present on ReyOS), and dropping efiBootLoaderVar.
#
# Stock cachyos-calamares sets efiBootLoaderVar: "packagechooser_bootloader"
# so this module reads the user's pick from a packagechooser@bootloader view
# step -- but ReyOS's settings.conf (modeled on the simpler cachyos-calamares
# "offline" sequence) never shows that page, so the referenced global-storage
# key is never set. Confirmed via a real end-to-end install on ReyOS-Test
# (2026-08-09): the "bootloader" job reported success with zero actual work
# logged (no Running QList(...) lines, unlike every other job) and no EFI
# boot files ever landed on the target's /boot -- the module was silently
# looking up an unset variable and no-op'ing instead of falling back to
# efiBootLoader below. Dropping efiBootLoaderVar makes efiBootLoader the
# only source of truth, restoring a real (non-interactive) limine install.
efiBootLoader: "limine"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

loaderEntries:
  - "timeout 5"
  - "console-mode keep"

kernelParams: [ "quiet","splash","nowatchdog" ]

refindKernelList: [ "linux" ]

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

efiBootloaderId: "reyos"

installEFIFallback: true

installHybridGRUB: false

limineSplashLogo: "/usr/share/backgrounds/reyos-wallpaper.jpg"
