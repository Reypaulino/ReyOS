#
# ReyOS override of cachyos-calamares's partition.conf. Default filesystem:
# btrfs since 2026-10-17 (was ext4 from 2026-08-09) for automatic snapshots
# before updates: mount.conf's @ / @home / @cache / @log ... layout with zstd
# compression, Timeshift set up by shellprocess@snapshots, snapshot boot
# entries from reyos-boot. ext4/xfs/f2fs stay selectable (no snapshots then).
# zfs dropped from availableFileSystemTypes since the zfs/zfshostid exec
# modules aren't in ReyOS's sequence (out of scope for now) — leaving zfs
# selectable on the partition page without those modules would produce a
# broken zfs install.
efiSystemPartition:     "/boot"

# 1 GiB, not 2: "Install alongside" reuses the machine's existing EFI system
# partition, and Calamares refuses (Next stays greyed out) when that partition
# is smaller than this value. Most existing installs (Ubuntu, Windows, Fedora)
# have a 512 MiB-1 GiB one, and ReyOS's /boot needs only a few hundred MiB.
efiSystemPartitionSize:     1024M

userSwapChoices:
    - none

luksGeneration: luks2

allowZfsEncryption: true

drawNestedPartitions:   false

alwaysShowPartitionLabels: true

initialPartitioningChoice: none

initialSwapChoice: none

defaultFileSystemType:  "btrfs"

defaultPartitionTableType: gpt

availableFileSystemTypes:  ["btrfs","ext4","xfs","f2fs"]

bootloaderOverrides:
    - name: grub
      allowZfsEncryption: false
      defaultFileSystemType:  "btrfs"
      availableFileSystemTypes:  ["btrfs","ext4","xfs","f2fs"]
      efiSystemPartition: "/boot/efi"
      efiSystemPartitionSize: 512M
      luksGeneration: luks2
      initialSwapChoice: none
      initialPartitioningChoice: none
    - name: limine
      allowZfsEncryption: true
      defaultFileSystemType:  "btrfs"
      availableFileSystemTypes:  ["btrfs","ext4","xfs","f2fs"]
      efiSystemPartition: "/boot"
      efiSystemPartitionSize: 4096M
      luksGeneration: luks2
      initialSwapChoice: none
      initialPartitioningChoice: none
