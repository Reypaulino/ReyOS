#
# ReyOS override of cachyos-calamares's partition.conf: only real change is
# the default filesystem (ext4, not btrfs) — chosen 2026-08-09 for a
# simpler/lower-risk first real exec-phase implementation over Btrfs's extra
# moving parts (subvolume layout, grub-btrfs for snapshot boot entries).
# zfs dropped from availableFileSystemTypes since the zfs/zfshostid exec
# modules aren't in ReyOS's sequence (out of scope for now) — leaving zfs
# selectable on the partition page without those modules would produce a
# broken zfs install.
efiSystemPartition:     "/boot"

efiSystemPartitionSize:     2048M

userSwapChoices:
    - none

luksGeneration: luks2

allowZfsEncryption: true

drawNestedPartitions:   false

alwaysShowPartitionLabels: true

initialPartitioningChoice: none

initialSwapChoice: none

defaultFileSystemType:  "ext4"

defaultPartitionTableType: gpt

availableFileSystemTypes:  ["ext4","btrfs","xfs","f2fs"]

bootloaderOverrides:
    - name: grub
      allowZfsEncryption: false
      defaultFileSystemType:  "ext4"
      availableFileSystemTypes:  ["ext4","btrfs","xfs","f2fs"]
      efiSystemPartition: "/boot/efi"
      efiSystemPartitionSize: 512M
      luksGeneration: luks2
      initialSwapChoice: none
      initialPartitioningChoice: none
    - name: limine
      allowZfsEncryption: true
      defaultFileSystemType:  "ext4"
      availableFileSystemTypes:  ["ext4","btrfs","xfs","f2fs"]
      efiSystemPartition: "/boot"
      efiSystemPartitionSize: 4096M
      luksGeneration: luks2
      initialSwapChoice: none
      initialPartitioningChoice: none
