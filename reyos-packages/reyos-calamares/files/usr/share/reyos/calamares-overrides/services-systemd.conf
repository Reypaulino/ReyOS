#
# cachyos-calamares's stock services-systemd.conf lists a service named
# "pacman-init" with action "disable" -- that's CachyOS's own same-named
# service, unrelated to ReyOS's pacman-init.service (see
# shellprocess_pacman_keyring.conf), which we need enabled every boot.
#
# Real bug found on a real fresh ReyOS-Test install (2026-08-19): the
# shellprocess@pacman_keyring job (early in the exec sequence, right
# after unpackfs) creates the multi-user.target.wants symlink correctly
# -- confirmed present immediately after that job runs -- but this
# module runs itself as the "services-systemd" step, near the very end
# of the exec sequence (right before umount). Its stock "disable" entry
# for "pacman-init" silently re-disables the unit after our shellprocess
# fix already ran, every single install. `systemctl status
# pacman-init.service` on the booted target showed `disabled` despite
# the earlier job's symlink existing right after it ran.
#
# Real fix: override this file (same pacman-file-conflict pattern as the
# other files here -- see reyos-apply-calamares-overrides.sh) with
# "pacman-init" set to "enable" instead of "disable". This module is
# Calamares' own native (non-shell) implementation, confirmed working
# for the other units in this same list (avahi-daemon, NetworkManager
# both got real target-side enablement symlinks during a real install)
# -- unlike shellprocess's `systemctl --root=` calls, which are a silent
# no-op in this environment. Once this runs last in the sequence, the
# earlier shellprocess@pacman_keyring symlink becomes redundant but
# harmless (idempotent, same target).
#
# Otherwise identical to cachyos-calamares's stock services-systemd.conf.
#
# Real bug found on a real fresh ReyOS-Test install (2026-08-24): a user
# who never opts into the "Customize Desktop" Welcome toggle should still
# have reyos-edit-mode-guard.service running (it's the only thing that
# actually blocks Plasma's Edit Mode overlay -- see reyos-themes's
# reyos-edit-mode-guard.sh comment: Plasma 6 has no real Kiosk Action
# Restriction gate for Corona.editMode, confirmed via symbol-table
# research, so this poll-and-revert workaround is the real fix, not a
# kdeglobals key). The service ships with a systemd user-preset
# (enable reyos-edit-mode-guard.service), but that alone wasn't enough --
# same class of gap as arch-update.timer below, which needed an explicit
# entry here (with user: true) to actually get enabled on a real install.
# Added below.

units:
   - name: "NetworkManager"
     action: "enable"
     mandatory: false

   - name: "cups"
     action: "enable"
     mandatory: false

   - name: "avahi-daemon"
     action: "enable"
     mandatory: false

   - name: "systemd-timesyncd"
     action: "enable"
     mandatory: false

   - name: "vboxservice"
     action: "enable"
     mandatory: false

   - name: "vmtoolsd"
     action: "enable"
     mandatory: false

   - name: "vmware-vmblock-fuse"
     action: "enable"
     mandatory: false

   - name: "firewalld"
     action: "enable"
     mandatory: false

   - name: "zfs-import-cache"
     action: "enable"
     mandatory: false

   - name: "zfs-mount"
     action: "enable"
     mandatory: false

   - name: "zfs-import.target"
     action: "enable"
     mandatory: false

   - name: "zfs.target"
     action: "enable"
     mandatory: false

   - name: "fstrim.timer"
     action: "enable"
     mandatory: false

   - name:  "pacman-init"
     action: "enable"
     mandatory:  false

   - name: "multi-user.target"
     action: "disable"
     mandatory:  false

   - name: "bluetooth"
     action: "enable"
     mandatory: false

   - name: "arch-update.timer"
     action: "enable"
     mandatory: false
     user: true

   - name: "arch-update-tray.service"
     action: "enable"
     mandatory: false
     user: true

   - name: "reyos-edit-mode-guard.service"
     action: "enable"
     mandatory: false
     user: true
