---
# ReyOS real-install config (2026-08-09) — replaces the earlier safe-preview
# version (exec: [], dont-chroot: true) now that the exec phase is wired up.
#
# Modeled on cachyos-calamares's own "offline" sequence (settings_offline.conf)
# rather than its "online" one: our ISO's packages.x86_64 already bakes
# plasma-desktop + every reyos-* branding package straight into the live
# squashfs, so unpackfs-ing that squashfs onto the target disk gives a fully
# ReyOS-branded real install with zero separate package list to maintain —
# unlike the online sequence's pacstrap+packages@online model, which needs
# its own curated base-package list kept in sync by hand. Dropped three
# CachyOS-only shellprocess steps (shellprocess-before, shellprocess,
# shellprocess_enable_ufw) that the stock offline sequence includes — they
# invoke helper scripts (/usr/local/bin/remove-nvidia, dmcheck,
# /etc/calamares/scripts/shell-setup, bootloader-post-setup) that only exist
# because cachyos-calamares's pacstrap.conf copies them in via postInstallFiles;
# since we use unpackfs instead of pacstrap, those scripts never land on our
# target and the non-"-"-prefixed commands among them would hard-fail the
# install. Revisit only if real testing turns up a concrete gap they were
# covering (e.g. leftover liveuser home dir).
#
# "locale" (timezone/location) is included here deliberately — ReyOS
# Welcome's own Time & Region step was removed (2026-08-08) specifically
# so timezone gets asked once, here, during install rather than twice.
# Language selection stays on the Welcome page (Calamares' own Welcome
# page, not to be confused with ReyOS Welcome the app) since that's a
# separate concern from timezone.

modules-search: [ local ]

instances:
- id:     pacman_keyring
  module: shellprocess
  config: shellprocess_pacman_keyring.conf
- id:     fix_mkinitcpio_preset
  module: shellprocess
  config: shellprocess_fix_mkinitcpio_preset.conf
- id:     plymouth_theme
  module: shellprocess
  config: shellprocess_plymouth_theme.conf
- id:     limine_shim
  module: shellprocess
  config: shellprocess_limine_shim.conf
- id:     limine_entry
  module: shellprocess
  config: shellprocess_limine_entry.conf
- id:     sudoers_reyos_menu
  module: shellprocess
  config: shellprocess_sudoers_reyos_menu.conf
- id:     remove_live_autologin
  module: shellprocess
  config: shellprocess_remove_live_autologin.conf
- id:     firewall
  module: shellprocess
  config: shellprocess_firewall.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@pacman_keyring
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - shellprocess@fix_mkinitcpio_preset
  - shellprocess@plymouth_theme
  - initcpiocfg
  - initcpio
  - removeuser
  - shellprocess@remove_live_autologin
  - users
  - shellprocess@sudoers_reyos_menu
  - shellprocess@firewall
  - networkcfg
  - displaymanager
  - hwclock
  - shellprocess@limine_shim
  - bootloader
  - shellprocess@limine_entry
  - services-systemd
  - umount
- show:
  - finished

branding: reyos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
