#
# Automatic snapshots (2026-10-17): on a btrfs install (the default) point
# Timeshift at the system disk in btrfs mode; reyos-base's pre-update hook
# then keeps the last two "before update" snapshots and a boot entry for
# each. Does nothing on ext4/xfs/f2fs. Never fails the install.
dontChroot: true
timeout: 30
script:
    - "chroot ${ROOT} /usr/share/reyos/bin/reyos-snapshots setup || true"
    - "systemctl --root=${ROOT} enable reyos-snapshots-sync.service > /dev/null 2>&1 || true"
