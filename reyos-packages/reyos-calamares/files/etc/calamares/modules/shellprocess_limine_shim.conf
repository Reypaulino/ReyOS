#
# cachyos-calamares's bootloader module (main.py, install_limine()) hard-calls
# `limine-install` inside the target chroot for the EFI path. That binary
# does not exist in any package (confirmed: `pacman -Qo /usr/bin/limine-install`
# finds no owner, `pacman -Ql limine` lists no install script). Current
# upstream limine (12.5.2, official [extra]) dropped the installer script
# entirely -- USAGE.md documents the real UEFI install method as just
# copying BOOT*.EFI into the ESP's /EFI/BOOT directory, no separate
# installer needed. Confirmed via a real install: bootloader job hard-fails
# ("Bootloader installation error") since limine-install can't be found.
#
# Fix: ship a tiny shim at that exact path so cachyos-calamares's existing
# (otherwise-correct) call succeeds, without forking/patching their
# vendored main.py. The ESP is mounted at /boot directly in ReyOS's
# partition layout (single FAT32 boot partition, no separate /boot/efi).
dontChroot: true
timeout: 60
script:
    - "mkdir -p ${ROOT}/usr/bin"
    - |
      cat > ${ROOT}/usr/bin/limine-install <<'SHIM'
      #!/bin/sh
      # ReyOS shim -- see shellprocess_limine_shim.conf for why this exists.
      set -e
      mkdir -p /boot/EFI/BOOT
      cp /usr/share/limine/BOOTX64.EFI /boot/EFI/BOOT/BOOTX64.EFI
      SHIM
    - "chmod 755 ${ROOT}/usr/bin/limine-install"
