# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Grants the newly created account a scoped NOPASSWD sudoers rule for the
# routine maintenance commands ReyOS System Tools (reyos-system-menu.sh)
# runs, so the user isn't re-prompted for their password every time they
# check for updates, toggle performance mode, etc. Written here (once,
# during install, as root) rather than captured from the user at first
# login -- no password ever needs to be read or stored anywhere.
#
# Deliberately excludes the script's chown-based "fix permissions"
# feature: a NOPASSWD wildcard chown would let anything running as this
# user silently rewrite ownership of any file on disk (e.g. take
# /etc/sudoers itself), a real local-root path with zero confirmation.
# That action still goes through the script's own ensure_sudo() prompt.
#
# Follows the same /etc/sudoers.d drop-in pattern already used for
# liveuser in airootfs/root/customize_airootfs.sh (g_wheel), which
# confirms Arch's stock /etc/sudoers already includes that directory.
#
# The tee/mask/unmask rules below back swappiness and swap on/off
# persistence: plain `sysctl -w` and `swapoff -a` only change live
# kernel state, so both silently reverted on reboot until System
# Tools/Control Center started also writing a sysctl.d drop-in and
# masking the swap unit (systemd regenerates it from fstab on every
# boot, but an /etc/systemd/system mask always takes priority over
# that generated unit, so no fstab editing is needed).
#
# The systemctl start/stop/enable/disable rules back Control Center's
# Services page. Same risk class as the swap mask/unmask rules above --
# a logged-in user toggling units on their own machine, not a
# privilege-escalation vector.
#
# The ufw rules back Control Center's Firewall page. `ufw` itself
# refuses to run at all as a non-root user (even `ufw status`), so every
# subcommand the page needs is listed here -- still nothing beyond
# "open/close a port and toggle the firewall on your own machine", same
# risk class as the swap/governor rules above, not a privilege-escalation
# vector like the excluded chown.
#
# The timedatectl rules back Control Center's Date & Time page. All three
# are system-wide (not per-user) settings that normally need root; same
# risk class as the rest of this file -- can affect the whole machine's
# clock, but not escalate privilege.
#
# The nmcli rule backs Control Center's WireGuard import (Network page).
# Confirmed live: unlike `nmcli device wifi connect` (allowed unprivileged
# via NetworkManager's own lenient network-control polkit action),
# `nmcli connection import` hits NetworkManager's stricter
# settings.modify.system action and fails outright with "Insufficient
# privileges" for a normal user -- creating a brand-new system connection
# profile, not just activating an existing one. Activating/deactivating/
# removing the resulting profile (connection up/down/delete) worked fine
# unprivileged in the same test, same as Wi-Fi's saved networks, so only
# import needs a rule here.
#
# The pacman -S rule backs Control Center's Drivers page (NVIDIA driver
# install). Deliberately a single fixed package list, not a `pacman -S *`
# wildcard -- unlike -Rns (removing an already-installed package is
# self-limiting) or -Sy/-Su (only touching packages already tracked by
# the system), an unrestricted install wildcard would let anything
# running as this user pull in and run arbitrary new software as root
# via a malicious/typosquatted package name.
#
# The `pacman -Sy --noconfirm` and the block of individually-listed
# `pacman -S --needed --noconfirm <fixed group>` lines below back
# reyos-welcome's first-login software picker (SoftwarePage.qml /
# main.py's APP_PACMAN). Confirmed live (2026-08-26): without these, EVERY
# app in that picker failed to install on a real Calamares install --
# Welcome's InstallWorker runs bare `sudo pacman ...` with no controlling
# terminal (it's a GUI subprocess, not run from a shell), so sudo fails
# immediately with "a terminal is required to read the password" for any
# command not already covered by a NOPASSWD rule. `-Sy` alone (no
# `--noconfirm`) was already listed above for System Tools' own use but
# didn't match Welcome's exact invocation -- sudoers matches the literal
# argv, not a semantic equivalent, so it needed its own explicit line.
# One fixed line per `APP_PACMAN` value, matching the file's existing
# single-fixed-package-list philosophy from the Drivers rule above --
# `main.py`'s `startInstall()` issues one `pacman -S` call per selected
# app rather than combining multiple apps into one call, specifically so
# each call's argv matches one of these fixed lines exactly.
#
# `systemctl restart *` was added to the existing start/stop/enable/disable
# wildcard group above (same risk class already justified there) to cover
# the same picker's post-install step for Wine (restarts systemd-binfmt).
#
# Fixed (2026-08-27): `_ensure_multilib()` in main.py (Wine/Steam's
# multilib-pacman.conf-enabling `sed` call) hit this exact same
# no-controlling-terminal sudo failure. Rather than hand-escape the sed
# one-liner's literal `[`/`]` (sudoers glob metacharacters on top of sed's
# own regex escaping -- a wrong escape here would fail `visudo -c` and
# block this ENTIRE sudoers file, not just this one line), the sed moved
# into a small fixed-path helper script
# (`/usr/share/reyos/welcome/enable-multilib.sh`) and the NOPASSWD rule
# below grants calling that exact path with no arguments -- ordinary exact
# command matching, no glob escaping needed.
dontChroot: true
timeout: 30
script:
    - |
      rm -f /tmp/reyos-sudoers-system-menu
      cat > /tmp/reyos-sudoers-system-menu <<'SUDOERS'
      ${USER} ALL=(root) NOPASSWD: /usr/bin/pacman -Sy, \
                                    /usr/bin/pacman -Sy --noconfirm, \
                                    /usr/bin/pacman -Su --noconfirm, \
                                    /usr/bin/pacman -Syu --noconfirm, \
                                    /usr/bin/pacman -Rns *, \
                                    /usr/bin/pacman -Sc --noconfirm, \
                                    /usr/bin/pacman -S --needed --noconfirm steam, \
                                    /usr/bin/pacman -S --needed --noconfirm lutris, \
                                    /usr/bin/pacman -S --needed --noconfirm retroarch, \
                                    /usr/bin/pacman -S --needed --noconfirm gamemode lib32-gamemode mangohud lib32-mangohud, \
                                    /usr/bin/pacman -S --needed --noconfirm wine wine-mono wine-gecko winetricks, \
                                    /usr/bin/pacman -S --needed --noconfirm docker, \
                                    /usr/bin/pacman -S --needed --noconfirm neovim, \
                                    /usr/bin/pacman -S --needed --noconfirm base-devel, \
                                    /usr/bin/pacman -S --needed --noconfirm chromium, \
                                    /usr/bin/pacman -S --needed --noconfirm gimp, \
                                    /usr/bin/pacman -S --needed --noconfirm krita, \
                                    /usr/bin/pacman -S --needed --noconfirm obs-studio, \
                                    /usr/bin/pacman -S --needed --noconfirm libreoffice-fresh, \
                                    /usr/bin/pacman -S --needed --noconfirm btop, \
                                    /usr/bin/pacman -S --needed --noconfirm partitionmanager, \
                                    /usr/bin/pacman -S --needed --noconfirm fwupd, \
                                    /usr/bin/pacman -S --needed --noconfirm filelight, \
                                    /usr/bin/pacman -S --needed --noconfirm bleachbit, \
                                    /usr/share/reyos/welcome/enable-multilib.sh, \
                                    /usr/bin/lpadmin -p * -E -v * -m everywhere, \
                                    /usr/bin/lpadmin -x *, \
                                    /usr/bin/lpadmin -d *, \
                                    /usr/bin/tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor, \
                                    /usr/bin/sysctl -w vm.swappiness=*, \
                                    /usr/bin/tee /etc/sysctl.d/99-reyos-swappiness.conf, \
                                    /usr/bin/bash -c "echo 3 > /proc/sys/vm/drop_caches", \
                                    /usr/bin/swapoff -a, \
                                    /usr/bin/swapon -a, \
                                    /usr/bin/systemctl mask *.swap, \
                                    /usr/bin/systemctl unmask *.swap, \
                                    /usr/bin/systemctl start *, \
                                    /usr/bin/systemctl restart *, \
                                    /usr/bin/systemctl stop *, \
                                    /usr/bin/systemctl enable *, \
                                    /usr/bin/systemctl disable *, \
                                    /usr/bin/ufw status *, \
                                    /usr/bin/ufw --force enable, \
                                    /usr/bin/ufw disable, \
                                    /usr/bin/ufw allow *, \
                                    /usr/bin/ufw deny *, \
                                    /usr/bin/ufw --force delete *, \
                                    /usr/bin/timedatectl set-timezone *, \
                                    /usr/bin/timedatectl set-ntp *, \
                                    /usr/bin/timedatectl set-time *, \
                                    /usr/bin/nmcli connection import type wireguard file *, \
                                    /usr/bin/pacman -S --noconfirm --needed nvidia-dkms nvidia-utils, \
                                    /usr/bin/reboot
      SUDOERS
      if visudo -c -f /tmp/reyos-sudoers-system-menu >/dev/null 2>&1; then
        install -m 0440 -o root -g root /tmp/reyos-sudoers-system-menu ${ROOT}/etc/sudoers.d/99-reyos-system-menu
      fi
      rm -f /tmp/reyos-sudoers-system-menu
