#
# Limine is copied to the ESP's fallback path (EFI/BOOT/BOOTX64.EFI) but never
# registered in the firmware boot list, so on a dual-boot machine neither the
# firmware menu nor Ubuntu's GRUB offered ReyOS after the install (found on the
# first real alongside install, 2026-10-01). This adds a "ReyOS" entry with
# efibootmgr from the live system. Alongside another OS the existing default is
# kept; on a machine with nothing else, ReyOS becomes the default. Not fatal.
dontChroot: true
timeout: 30
script:
    - "/usr/share/reyos/bin/reyos-efi-entry ${ROOT}"
