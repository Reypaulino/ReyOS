#
# Hardware driver step. reyos-gpu-detect (reyos-base) reads the PCI IDs and
# prints the extra packages this machine needs; the open-source stack (mesa,
# vulkan-intel/radeon/nouveau, intel-media-driver) already ships in the image.
# Today the only extra is NVIDIA's open driver, and only on an NVIDIA-only
# machine with a Turing or newer card -- Maxwell/Pascal cards cannot use it
# (they stay on nouveau) and hybrid laptops stay on mesa so no NVIDIA EGL or
# Vulkan driver takes over the Intel/AMD GPU.
#
# The logic lives in a script because Calamares substitutes bare dollar-names in this
# text and fails the install on any variable it does not know.
#
# Runs in the target after the initramfs is built (the dkms/mkinitcpio hooks
# rebuild it once more). Deliberately NOT fatal: with no network the install
# still finishes and the Control Center Drivers page offers the driver later.
dontChroot: false
timeout: 900
script:
    - "/usr/share/reyos/bin/reyos-hw-drivers"
