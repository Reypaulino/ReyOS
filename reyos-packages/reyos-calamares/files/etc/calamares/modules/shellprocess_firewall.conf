#
# Enables ufw (default deny incoming / allow outgoing) on the installed
# system. `ufw enable`/`ufw default` themselves can't run safely here --
# they'd apply to the *live* Calamares environment's own netfilter rules,
# not the target's, since the target kernel isn't running yet -- so this
# writes the exact same config files those commands would produce directly
# instead (matches ufw's real file format: DEFAULT_*_POLICY in
# /etc/default/ufw, ENABLED= in /etc/ufw/ufw.conf, both already present on
# the target from unpackfs since `ufw` ships in packages.x86_64), then
# enables the systemd unit offline via `systemctl --root`, which only
# manipulates unit symlinks and needs no running target kernel.
#
# No default-allow rule for SSH: sshd isn't enabled by default on a real
# ReyOS install (no `services-systemd` override in this package turns it
# on -- it only runs on the dev/test VMs because it was enabled by hand for
# our own workflow), so there's nothing listening on 22 to protect access
# to yet. A user who enables sshd themselves can open the port from
# Control Center's own Firewall page.
dontChroot: true
timeout: 30
script:
    - |
      mkdir -p ${ROOT}/etc/default ${ROOT}/etc/ufw
      sed -i \
        -e 's/^DEFAULT_INPUT_POLICY=.*/DEFAULT_INPUT_POLICY="DROP"/' \
        -e 's/^DEFAULT_OUTPUT_POLICY=.*/DEFAULT_OUTPUT_POLICY="ACCEPT"/' \
        -e 's/^DEFAULT_FORWARD_POLICY=.*/DEFAULT_FORWARD_POLICY="DROP"/' \
        ${ROOT}/etc/default/ufw
      sed -i 's/^ENABLED=.*/ENABLED=yes/' ${ROOT}/etc/ufw/ufw.conf
    - systemctl --root=${ROOT} enable ufw > /dev/null 2>&1 || true
