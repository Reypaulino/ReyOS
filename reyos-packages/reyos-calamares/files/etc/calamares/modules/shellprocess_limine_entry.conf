#
# cachyos-calamares's bootloader module (update_limine_config() in
# main.py) writes a limine.conf with the entry header only:
#
#   comment: machine-id=...
#   /+CachyOS
#
# ...and nothing else. On real CachyOS, the entry BODY (protocol/
# kernel_path/module_path/cmdline) is filled in later by a pacman hook
# shipped in `limine-mkinitcpio-hook`, which regenerates it every time
# mkinitcpio runs. That package does not exist in the official Arch repos
# (confirmed: not ownable via pacman -Qo/-Ql/-Si) -- ReyOS never has
# anything that writes the entry body, so the installed system panics at
# boot with "Boot protocol not specified for this entry" (confirmed via
# a real install + reboot). Calamares' own update_limine_config() DOES
# write the values this needs to /etc/default/limine (ESP_PATH,
# KERNEL_CMDLINE, root UUID) -- they're just never consumed. This job
# reads that file and appends the missing entry body directly.
#
# Real bug found running this for real (2026-08-10): Calamares'
# shellprocess module does its own ${...} substitution on the script
# text before handing it to bash -- it doesn't recognize ${CMDLINE} (not
# one of its own ROOT/USER/LANG/gs[...] variables) and hard-fails with
# "Missing variables: QList(CMDLINE)" before the shell ever runs. Tried
# referencing it as bare $CMDLINE (no braces) first -- same failure, so
# Calamares' substitution matches bare $VAR too, not just ${VAR}. Real
# fix: never write a standalone $CMDLINE/${CMDLINE} token at all --
# inline the $(...) command substitution directly at the point of use
# instead of assigning it to a shell variable first. $(...) doesn't
# match Calamares' variable-reference pattern (parens aren't part of a
# variable name), and bash still expands it normally inside the
# unquoted heredoc.
#
# The "/+CachyOS" entry title itself (user-reported, seen on the Limine
# boot menu on a real install) is hardcoded by update_limine_config() --
# it doesn't read branding.desc's bootloaderEntryName (that key only
# feeds the EFI boot manager entry via efiBootloaderId, a separate
# mechanism). Since that module lives in the cachyos-calamares package
# itself, not this repo, renamed it here with a sed pass before
# appending the entry body.
dontChroot: true
timeout: 30
script:
    - |
      sed -i 's#^/+CachyOS$#/+ReyOS#' ${ROOT}/boot/limine.conf
    - |
      cat >> ${ROOT}/boot/limine.conf <<EOF
      	protocol: linux
      	kernel_path: boot():/vmlinuz-linux
      	module_path: boot():/initramfs-linux.img
      	cmdline: $(grep -oP 'KERNEL_CMDLINE\[default\]\+="\K[^"]*' ${ROOT}/etc/default/limine)
      EOF
