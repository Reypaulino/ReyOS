#
# unpackfs copies the entire live squashfs onto the target verbatim,
# which includes /etc/mkinitcpio.d/linux.preset — but that file, on the
# live ISO, is the *archiso*-specific preset (mkinitcpio-archiso ships it
# to build the ISO's own live boot image): PRESETS=('archiso'), pointed
# at /etc/mkinitcpio.conf.d/archiso.conf rather than the real
# /etc/mkinitcpio.conf. So when the later "initcpio" job runs
# `mkinitcpio -P` in the target chroot, it genuinely succeeds — but
# regenerates initramfs-linux.img using archiso's own hooks (which
# expect to find/mount a live squashfs, not a plain root partition),
# not the HOOKS actually configured in /etc/mkinitcpio.conf. Confirmed
# via a real install + reboot: the installed system panicked in the
# initramfs with "'' device did not show up after 30 seconds", even
# though the real root partition was genuinely present and correctly
# referenced in the kernel cmdline — because the wrong hook set was
# baked into the initramfs.
#
# Fixed by restoring the standard Arch `linux` package's own preset
# (verified content: PRESETS=('default' 'fallback'), writing
# initramfs-linux.img / initramfs-linux-fallback.img via the real
# /etc/mkinitcpio.conf) before the initcpiocfg/initcpio jobs run.
#
# That alone isn't enough, though: mkinitcpio also auto-merges every
# file under /etc/mkinitcpio.conf.d/*.conf as a drop-in regardless of
# what the preset points at, and unpackfs carried over
# /etc/mkinitcpio.conf.d/archiso.conf too — its own HOOKS= line
# (archiso/archiso_loop_mnt/archiso_pxe_*/memdisk, no systemd/autodetect/
# sd-vconsole/fsck) silently wins over /etc/mkinitcpio.conf's real HOOKS.
# Confirmed by re-running mkinitcpio in a chroot after only fixing the
# preset: log still showed "Using drop-in configuration file:
# archiso.conf" and the same archiso hook set. Must remove the drop-in
# too, not just fix the preset.
dontChroot: true
timeout: 30
script:
    - "rm -f ${ROOT}/etc/mkinitcpio.conf.d/archiso.conf"
    - |
      cat > ${ROOT}/etc/mkinitcpio.d/linux.preset <<'PRESET'
      # mkinitcpio preset file for the 'linux' package

      #ALL_config="/etc/mkinitcpio.conf"
      ALL_kver="/boot/vmlinuz-linux"

      PRESETS=('default' 'fallback')

      #default_config="/etc/mkinitcpio.conf"
      default_image="/boot/initramfs-linux.img"
      #default_options=""

      #fallback_config="/etc/mkinitcpio.conf"
      fallback_image="/boot/initramfs-linux-fallback.img"
      fallback_options="-S autodetect"
      PRESET
