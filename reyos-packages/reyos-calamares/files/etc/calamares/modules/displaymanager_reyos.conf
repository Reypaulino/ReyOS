# Same as reyos-calamares-core's displaymanager.conf, plus the session new
# installs start in: Plasma (Wayland). ReyOS used X11 from 2026-10-17 until
# Plasma 6.8 dropped it (Arch, 2026-10-16).
displaymanagers:
  - plasmalogin
  - sddm
  - lightdm
  - gdm
  - cosmic-greeter
  - lxdm
  - greetd
defaultDesktopEnvironment:
  executable: "/usr/bin/startplasma-wayland"
  desktopFile: "plasma"
sysconfigSetup: false
greetd:
  greeter_user: "greeter"
  greeter_group: "greeter"
lightdm:
  preferred_greeters: ["lightdm-greeter.desktop", "slick-greeter.desktop"]
sddm:
  configuration_file: "/etc/sddm.conf"
