# Same as reyos-calamares-core's displaymanager.conf, plus the session new
# installs start in: Plasma X11 (ReyOS's default since 2026-10-17; faster on
# older Intel graphics, and remote help works unattended there). Without it
# Calamares maps startplasma-x11 to the Wayland session file "plasma".
# Wayland stays installed and can be picked at the login screen.
displaymanagers:
  - plasmalogin
  - sddm
  - lightdm
  - gdm
  - cosmic-greeter
  - lxdm
  - greetd
defaultDesktopEnvironment:
  executable: "/usr/bin/startplasma-x11"
  desktopFile: "plasmax11"
sysconfigSetup: false
greetd:
  greeter_user: "greeter"
  greeter_group: "greeter"
lightdm:
  preferred_greeters: ["lightdm-greeter.desktop", "slick-greeter.desktop"]
sddm:
  configuration_file: "/etc/sddm.conf"
