#
# The "Install ReyOS" autostart entry is only for the live session; the
# package ships it in /etc/xdg/autostart, so unpackfs carries it into the
# installed system, where it just pops up a "live session only" dialog at
# every login. Remove it from the target.
dontChroot: true
timeout: 30
script:
    - rm -f ${ROOT}/etc/xdg/autostart/reyos-installer.desktop
