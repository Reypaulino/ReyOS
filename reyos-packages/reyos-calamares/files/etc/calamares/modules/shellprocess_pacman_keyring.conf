#
# Real bug found live on a fresh ReyOS-Test install (2026-08-18): the
# Control Center's "Full update" failed with "keyring is not writable",
# "required key missing from keyring", "failed to commit transaction
# (unexpected error)" -- no package can ever install or update on a fresh
# install until this is fixed.
#
# First fix attempt (superseded, kept here for the record): manually
# wiping and reinitializing ${ROOT}/etc/pacman.d/gnupg via `pacman-key
# --gpgdir ... --init/--populate` right after unpackfs. That ran and
# succeeded at install time, but was pointless -- confirmed live that
# /etc/pacman.d/gnupg is mounted as a *tmpfs* on every boot (see
# etc-pacman.d-gnupg.mount, shipped standard in the airootfs since the
# squashfs itself is read-only), so whatever gets written there at
# install time is invisibly shadowed the moment the target boots for
# real, every single boot, forever. A second, unrelated real bug (missing
# `cachyos-keyring` package, fixed separately in packages.x86_64) was
# masking this one during testing.
#
# Real fix: the airootfs already ships `pacman-init.service` (Requires+
# BindsTo etc-pacman.d-gnupg.mount, runs `pacman-key --init` then
# `--populate` on every start) -- exactly the right mechanism, built for
# exactly this tmpfs-shadowing problem. It's just never enabled by
# default (`systemctl status` on a live/installed system both show
# `disabled`). Confirmed live: manually `systemctl start
# pacman-init.service` on ReyOS-Test succeeded completely (`--init` and
# `--populate` both status=0/SUCCESS) once cachyos-keyring was present.
#
# Second fix attempt (superseded): `systemctl --root=${ROOT} enable
# pacman-init.service`. This job ran without error every time (confirmed
# via a full `calamares -d` captured log: job 12/41, whole 41-job
# sequence completes with no failure) -- but on the booted target,
# `systemctl status pacman-init.service` still showed `disabled` and
# "Full update" still failed with the exact original error. So
# `systemctl --root=` silently doesn't create the enablement symlink in
# this environment (Calamares' shellprocess execution context, not a
# real chroot/booted system) -- no error, just a no-op.
#
# Real fix: skip `systemctl --root` entirely and create the exact same
# symlink it's supposed to create, directly. This is what `systemctl
# enable` does under the hood for a `WantedBy=multi-user.target` unit --
# doing it with `ln` has no dependency on systemctl's offline-root
# resolution logic working correctly.
dontChroot: true
timeout: 30
script:
    - mkdir -p ${ROOT}/etc/systemd/system/multi-user.target.wants
    - ln -sf /etc/systemd/system/pacman-init.service ${ROOT}/etc/systemd/system/multi-user.target.wants/pacman-init.service
