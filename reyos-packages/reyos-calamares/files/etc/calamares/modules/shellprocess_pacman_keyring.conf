#
# The live image keeps /etc/pacman.d/gnupg on a tmpfs (etc-pacman.d-gnupg.mount)
# and rebuilds it at every boot with pacman-init.service, because the live
# squashfs is read-only. unpackfs copied both units into the target, so the
# installed system threw away its keyring and made a new master key on every
# boot (found 2026-10-01). The installed root is writable, so drop both units,
# build the keyring once, here, and trust the reyos-local signing key
# permanently. History of the earlier fixes for this: git log of this file.
#
# Runs inside the target (dontChroot false). Any failing command aborts the
# install, deliberately -- a system without a keyring can never update.
dontChroot: false
timeout: 600
script:
    - rm -f /etc/systemd/system/etc-pacman.d-gnupg.mount /etc/systemd/system/pacman-init.service /etc/systemd/system/multi-user.target.wants/pacman-init.service
    - rm -rf /etc/pacman.d/gnupg
    - pacman-key --init
    - pacman-key --populate
    - pacman-key --add /usr/share/reyos/reyos-signing-key.asc
    - pacman-key --lsign-key 9A17D49EE3929AC6402337FA66E4085621026272
