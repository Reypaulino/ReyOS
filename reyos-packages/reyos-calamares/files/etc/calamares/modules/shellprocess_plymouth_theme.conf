#
# Two things a Plymouth splash needs that unpackfs alone doesn't provide:
#
# 1. Which theme to use. `plymouth`'s own default /etc/plymouth/plymouthd.conf
#    doesn't know about ours, and shipping our own copy of that exact path
#    from reyos-plymouth would be the same kind of pacman file-ownership
#    conflict already hit once with lsb-release (see reyos-base's
#    reyos-apply-lsb-release.sh) -- so it's written here, at install time,
#    instead of packaged.
#
# 2. The "plymouth" mkinitcpio hook. unpackfs carries over the target's real
#    /etc/mkinitcpio.conf (confirmed live on the `ReyOS` dev VM: stock Arch
#    HOOKS, no plymouth), and nothing installs the hook into it on its own.
#    Inserted right after "udev" -- the ArchWiki-documented position for a
#    non-systemd/busybox-style HOOKS line, which is what this target actually
#    uses (confirmed live: no systemd/sd-vconsole hooks) -- and the sed is
#    scoped to only the HOOKS= line so nothing else in the file is at risk.
#
# Must run before initcpiocfg/initcpio below, same as
# shellprocess@fix_mkinitcpio_preset (right before this instance in the
# sequence) -- mkinitcpio only bakes in the hooks/theme present at the
# moment it actually builds the initramfs.
dontChroot: true
timeout: 30
script:
    - |
      mkdir -p ${ROOT}/etc/plymouth
      cat > ${ROOT}/etc/plymouth/plymouthd.conf <<'PLYMOUTHD'
      [Daemon]
      Theme=reyos
      PLYMOUTHD
    - sed -i '/^HOOKS=/s/\budev\b/udev plymouth/' ${ROOT}/etc/mkinitcpio.conf
