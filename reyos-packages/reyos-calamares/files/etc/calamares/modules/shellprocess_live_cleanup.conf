#
# unpackfs copies the whole live image into the target, including settings that
# only make sense on the live USB. Found on the first real-hardware install
# (2026-10-01, docs/bugs.md): a passwordless root autologin on tty1, sshd
# enabled with PermitRootLogin/PasswordAuthentication yes, volatile logs, a
# lid switch that does nothing, and live-only helper units. Remove them all
# from the target here. Each path comes from reyos-iso/airootfs.
dontChroot: true
timeout: 30
script:
    - |
      # passwordless root shell on tty1
      rm -f ${ROOT}/etc/systemd/system/getty@tty1.service.d/autologin.conf
      rmdir ${ROOT}/etc/systemd/system/getty@tty1.service.d 2>/dev/null || true
      # remote root login over ssh (sshd is enabled in the live image)
      rm -f ${ROOT}/etc/ssh/sshd_config.d/10-archiso.conf
      rm -f ${ROOT}/etc/systemd/system/multi-user.target.wants/sshd.service
      # logs must survive a reboot; closing the lid must suspend
      rm -f ${ROOT}/etc/systemd/journald.conf.d/volatile-storage.conf
      rm -f ${ROOT}/etc/systemd/logind.conf.d/do-not-suspend.conf
      rm -f ${ROOT}/etc/systemd/resolved.conf.d/archiso.conf
      # live-only helper units
      rm -f ${ROOT}/etc/systemd/system/livecd-talk.service ${ROOT}/etc/systemd/system/multi-user.target.wants/livecd-talk.service ${ROOT}/etc/systemd/system/sound.target.wants/livecd-talk.service
      rm -f ${ROOT}/etc/systemd/system/choose-mirror.service ${ROOT}/etc/systemd/system/multi-user.target.wants/choose-mirror.service ${ROOT}/etc/systemd/system/sound.target.wants/choose-mirror.service
      rm -f ${ROOT}/etc/systemd/system/livecd-alsa-unmuter.service ${ROOT}/etc/systemd/system/multi-user.target.wants/livecd-alsa-unmuter.service ${ROOT}/etc/systemd/system/sound.target.wants/livecd-alsa-unmuter.service
      # live installer entry points
      rm -f ${ROOT}/usr/share/applications/reyos-install.desktop
      rm -f ${ROOT}/usr/share/applications/reyos-installer.desktop
      rm -f ${ROOT}/etc/xdg/autostart/reyos-installer.desktop
