<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReyOS Browser</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse 70% 52% at 50% 8%,#6B3A1D 0,transparent 68%),radial-gradient(ellipse 90% 70% at 50% 105%,#2B170E 0,transparent 72%),linear-gradient(145deg,#0B0807 0%,#17100C 48%,#0B0807 100%);color:#FFF3E6;font:16px system-ui,sans-serif}.wrap{text-align:center;width:min(720px,90vw)}.mark{width:118px;height:118px;display:block;object-fit:contain;margin:0 auto 8px;filter:drop-shadow(0 14px 24px #0009)}h1{margin:22px 0 6px;font-size:34px}.sub{color:#F4D5A8;margin-bottom:28px}form{display:flex;gap:8px;background:#211711E8;border:1px solid #A96A35;border-radius:15px;padding:8px;box-shadow:0 16px 42px #0009;backdrop-filter:blur(10px)}input{flex:1;min-width:0;padding:13px 16px;border:0;outline:0;border-radius:10px;background:#302217;color:#FFF3E6;font:inherit}button{padding:12px 20px;border:0;border-radius:10px;background:#C97932;color:white;font:inherit;font-weight:700;cursor:pointer}.note{margin-top:19px;color:#D7C1AA;font-size:14px}</style></head>
<body><main class="wrap"><img class="mark" src="assets/reyos-r-penguin.png" alt="ReyOS"><h1>ReyOS Browser</h1><p class="sub">Simple, private browsing — ready when you are.</p><form action="https://duckduckgo.com/" method="get"><input name="q" autofocus placeholder="Search the web privately"><button type="submit">Private Search</button></form><p class="note">Private session · No ReyOS account · No built-in VPN</p></main></body></html>
