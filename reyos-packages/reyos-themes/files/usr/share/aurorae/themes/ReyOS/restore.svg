<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- ReyOS restore button shown while a window is maximized. The nearly-
     transparent rects define the complete FrameSvg state bounds. -->
<svg width="20" height="20" viewBox="0 0 20 20" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <g id="active-center">
    <rect x="0" y="0" width="20" height="20" fill="#000000" fill-opacity="0.003" />
    <path d="M 8,6 H 14 V 12 M 12,14 H 6 V 8 H 12 Z" stroke="#e8dcd0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <g id="hover-center">
    <rect x="0" y="0" width="20" height="20" fill="#000000" fill-opacity="0.003" />
    <circle cx="10" cy="10" r="8" fill="#e8dcd0" fill-opacity="0.16" />
    <path d="M 8,6 H 14 V 12 M 12,14 H 6 V 8 H 12 Z" stroke="#fff3e6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
